<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="naturalBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <radialGradient id="rockRough" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="85%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
    <radialGradient id="innerSmooth" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="60%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </radialGradient>
    <filter id="shadowRock" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-opacity="0.25" flood-color="#0f172a"/>
    </filter>
  </defs>

  <rect width="600" height="450" fill="url(#naturalBg)"/>
  
  <path d="M 0 310 L 600 310" stroke="#cbd5e1" stroke-width="2"/>
  <rect y="310" width="600" height="140" fill="#e2e8f0" opacity="0.6"/>

  <!-- Shadow -->
  <ellipse cx="300" cy="326" rx="200" ry="36" fill="#0f172a" opacity="0.25" filter="url(#shadowRock)"/>

  <!-- Organic Boulder Shape (Batu Kali Alam) -->
  <g filter="url(#shadowRock)">
    <!-- Natural Asymmetrical Organic Curve -->
    <path d="M 105 190 C 100 270, 160 330, 290 335 C 410 340, 495 285, 490 195 C 485 140, 420 120, 310 125 C 190 130, 110 145, 105 190 Z" fill="url(#rockRough)"/>
    
    <!-- Stone exterior bumps and texture -->
    <circle cx="150" cy="260" r="12" fill="#1e293b" opacity="0.4"/>
    <circle cx="440" cy="270" r="16" fill="#0f172a" opacity="0.5"/>
    <circle cx="210" cy="300" r="14" fill="#334155" opacity="0.6"/>
    <path d="M 130 220 Q 180 270, 240 285" stroke="#1e293b" stroke-width="3" fill="none" opacity="0.5"/>
    <path d="M 370 290 Q 420 275, 470 230" stroke="#0f172a" stroke-width="3" fill="none" opacity="0.6"/>
    
    <!-- Polished Inner Cavity (Hollowed & Smooth) -->
    <path d="M 140 190 C 140 245, 205 275, 305 275 C 400 275, 455 240, 455 190 C 455 155, 395 140, 305 140 C 210 140, 140 155, 140 190 Z" fill="url(#innerSmooth)"/>
    
    <!-- Drain Hole -->
    <ellipse cx="305" cy="215" rx="22" ry="9" fill="#0f172a"/>
    <ellipse cx="305" cy="214" rx="17" ry="7" fill="#64748b"/>
    <ellipse cx="305" cy="213" rx="13" ry="5" fill="#020617"/>
    <circle cx="305" cy="213" r="3" fill="#cbd5e1"/>
  </g>

  <!-- Polished Inner Water Reflection Highlight -->
  <path d="M 170 180 C 200 160, 255 152, 305 152 C 355 152, 400 160, 425 180 C 395 168, 350 160, 305 160 C 255 160, 205 168, 170 180 Z" fill="#ffffff" opacity="0.5"/>

  <!-- Badge Info -->
  <rect x="24" y="24" width="165" height="32" rx="16" fill="#0f172a" opacity="0.9"/>
  <text x="106" y="44" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">UD PUTRA ABADI</text>
</svg>
