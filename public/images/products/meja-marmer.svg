<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="roomBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <radialGradient id="tableTop" cx="45%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="85%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </radialGradient>
    <linearGradient id="metalLegs" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="tableShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="20" stdDeviation="16" flood-opacity="0.22" flood-color="#0f172a"/>
    </filter>
  </defs>

  <rect width="600" height="450" fill="url(#roomBg)"/>
  
  <path d="M 0 350 L 600 350" stroke="#cbd5e1" stroke-width="2"/>
  <rect y="350" width="600" height="100" fill="#f1f5f9"/>

  <!-- Floor Shadows for legs -->
  <ellipse cx="230" cy="380" rx="30" ry="10" fill="#0f172a" opacity="0.4"/>
  <ellipse cx="370" cy="380" rx="30" ry="10" fill="#0f172a" opacity="0.4"/>
  <ellipse cx="300" cy="390" rx="40" ry="12" fill="#0f172a" opacity="0.3"/>

  <!-- Modern Hairpin / Cross Metal Legs -->
  <g stroke="url(#metalLegs)" stroke-width="8" stroke-linecap="round">
    <line x1="220" y1="210" x2="230" y2="380"/>
    <line x1="380" y1="210" x2="370" y2="380"/>
    <line x1="300" y1="220" x2="300" y2="390"/>
    <!-- Cross Bracing -->
    <line x1="225" y1="300" x2="375" y2="300" stroke-width="5" stroke="#334155"/>
  </g>

  <!-- Round Marble Table Top Slab -->
  <g filter="url(#tableShadow)">
    <!-- 3D Edge Rim of Marble Table -->
    <path d="M 100 200 C 100 255, 190 280, 300 280 C 410 280, 500 255, 500 200 L 500 215 C 500 270, 410 295, 300 295 C 190 295, 100 270, 100 215 Z" fill="#94a3b8"/>
    
    <!-- Top Ellipse Surface -->
    <ellipse cx="300" cy="200" rx="200" ry="65" fill="url(#tableTop)"/>
    
    <!-- Natural Carrara/Campurdarat Marble Grey Veins -->
    <path d="M 140 180 Q 230 225, 330 200 T 470 210" stroke="#94a3b8" stroke-width="3" fill="none" opacity="0.5" stroke-linecap="round"/>
    <path d="M 180 155 Q 260 185, 340 165 T 440 175" stroke="#cbd5e1" stroke-width="2.5" fill="none" opacity="0.6"/>
    <path d="M 220 220 Q 300 240, 380 230" stroke="#94a3b8" stroke-width="2" fill="none" opacity="0.45"/>
  </g>

  <!-- Hi-Glossy Reflection Highlight -->
  <path d="M 140 190 C 180 160, 240 148, 300 148 C 360 148, 420 160, 460 190 C 420 170, 360 160, 300 160 C 240 160, 180 170, 140 190 Z" fill="#ffffff" opacity="0.6"/>

  <!-- Badge Info -->
  <rect x="24" y="24" width="185" height="32" rx="16" fill="#1e3a8a" opacity="0.95"/>
  <text x="116" y="44" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">MEJA BUNDAR MARMER</text>
</svg>
