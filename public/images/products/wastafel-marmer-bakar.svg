<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="burnedBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <radialGradient id="burnedTexture" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="85%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
    <radialGradient id="smoothBowlBakar" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="70%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </radialGradient>
    <filter id="shadowBurned" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-opacity="0.25" flood-color="#0f172a"/>
    </filter>
  </defs>

  <rect width="600" height="450" fill="url(#burnedBg)"/>
  
  <path d="M 0 310 L 600 310" stroke="#94a3b8" stroke-width="2"/>
  <rect y="310" width="600" height="140" fill="#e2e8f0"/>

  <!-- Shadow -->
  <ellipse cx="300" cy="326" rx="190" ry="36" fill="#0f172a" opacity="0.22" filter="url(#shadowBurned)"/>

  <!-- Burned Marble Outer Body (Flamed / Antique Finish) -->
  <g filter="url(#shadowBurned)">
    <path d="M 120 200 C 120 290, 190 330, 300 330 C 410 330, 480 290, 480 200 C 480 160, 400 135, 300 135 C 200 135, 120 160, 120 200 Z" fill="url(#burnedTexture)"/>
    
    <!-- Burned Chiseled Texture Flecks -->
    <circle cx="160" cy="240" r="4" fill="#64748b" opacity="0.8"/>
    <circle cx="210" cy="280" r="5" fill="#94a3b8" opacity="0.7"/>
    <circle cx="260" cy="300" r="6" fill="#64748b" opacity="0.8"/>
    <circle cx="340" cy="310" r="5" fill="#94a3b8" opacity="0.7"/>
    <circle cx="410" cy="270" r="4" fill="#64748b" opacity="0.8"/>
    <path d="M 150 210 Q 230 260, 270 310" stroke="#0f172a" stroke-width="3" fill="none" opacity="0.6"/>
    <path d="M 350 310 Q 400 260, 450 210" stroke="#0f172a" stroke-width="3" fill="none" opacity="0.6"/>

    <!-- Inner Smooth Cavity -->
    <ellipse cx="300" cy="205" rx="160" ry="56" fill="url(#smoothBowlBakar)"/>
    
    <!-- Drain Hole -->
    <ellipse cx="300" cy="225" rx="22" ry="9" fill="#020617"/>
    <ellipse cx="300" cy="224" rx="18" ry="7" fill="#64748b"/>
    <ellipse cx="300" cy="223" rx="14" ry="5" fill="#000000"/>
    <circle cx="300" cy="223" r="3" fill="#cbd5e1"/>
  </g>

  <!-- Reflection -->
  <path d="M 160 185 C 190 165, 245 152, 300 152 C 355 152, 410 165, 440 185" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.4"/>

  <!-- Badge Info -->
  <rect x="24" y="24" width="185" height="32" rx="16" fill="#334155" opacity="0.95"/>
  <text x="116" y="44" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">MARMER BAKAR ANTIK</text>
</svg>
