<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="lampBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="lampLight" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#f59e0b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lampStone" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="40%" stop-color="#64748b"/>
      <stop offset="70%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="600" height="450" fill="url(#lampBg)"/>
  
  <!-- Counter surface -->
  <path d="M 0 350 L 600 350" stroke="#334155" stroke-width="1.5"/>
  
  <!-- Warm Light Ambient Glow -->
  <circle cx="300" cy="180" r="160" fill="url(#lampLight)" filter="url(#glow)"/>

  <!-- Base Shadow -->
  <ellipse cx="300" cy="355" rx="90" ry="20" fill="#020617" opacity="0.8"/>

  <!-- Lamp Body Cylindrical Sculpture -->
  <g>
    <!-- Base Foot -->
    <path d="M 230 340 L 230 350 C 230 360, 370 360, 370 350 L 370 340 Z" fill="#1e293b"/>
    
    <!-- Cylindrical Main Body with carved light slits -->
    <path d="M 240 160 L 220 340 C 220 350, 380 350, 380 340 L 360 160 Z" fill="url(#lampStone)"/>
    
    <!-- Top Rim -->
    <ellipse cx="300" cy="160" rx="60" ry="20" fill="#64748b"/>
    <ellipse cx="300" cy="158" rx="50" ry="15" fill="#fef08a" opacity="0.85" filter="url(#glow)"/>

    <!-- Carved Geometric Light Slits (Tembus Cahaya) -->
    <!-- Slit 1 -->
    <path d="M 260 200 Q 300 210, 340 200 L 338 215 Q 300 225, 262 215 Z" fill="#fef08a" filter="url(#glow)"/>
    <!-- Slit 2 -->
    <path d="M 255 240 Q 300 252, 345 240 L 343 255 Q 300 267, 257 255 Z" fill="#fef08a" filter="url(#glow)"/>
    <!-- Slit 3 -->
    <path d="M 250 280 Q 300 294, 350 280 L 348 295 Q 300 309, 252 295 Z" fill="#fef08a" filter="url(#glow)"/>
  </g>

  <!-- Specular Reflection on Stone -->
  <path d="M 250 170 L 235 330" stroke="#ffffff" stroke-width="3" opacity="0.3" stroke-linecap="round"/>

  <!-- Badge Info -->
  <rect x="24" y="24" width="175" height="32" rx="16" fill="#f59e0b" opacity="0.95"/>
  <text x="111" y="44" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">KAP LAMPU HIAS</text>
</svg>
