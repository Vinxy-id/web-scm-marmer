<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="onyxBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <radialGradient id="onyxGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#fde047" stop-opacity="0.85"/>
      <stop offset="70%" stop-color="#ca8a04" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#854d0e" stop-opacity="0.3"/>
    </radialGradient>
    <radialGradient id="onyxBody" cx="45%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="30%" stop-color="#fef3c7"/>
      <stop offset="65%" stop-color="#fcd34d"/>
      <stop offset="90%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </radialGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Luxury Dark Countertop Background -->
  <rect width="600" height="450" fill="url(#onyxBg)"/>
  
  <!-- Backlight Glow Ambient -->
  <circle cx="300" cy="220" r="140" fill="#fef08a" opacity="0.22" filter="url(#goldGlow)"/>

  <!-- Countertop surface -->
  <path d="M 0 315 L 600 315" stroke="#334155" stroke-width="1.5"/>
  <rect y="315" width="600" height="135" fill="#0b0f19"/>

  <!-- Glowing Shadow below sink -->
  <ellipse cx="300" cy="325" rx="180" ry="32" fill="#000000" opacity="0.6"/>
  <ellipse cx="300" cy="325" rx="140" ry="20" fill="#f59e0b" opacity="0.3" filter="url(#goldGlow)"/>

  <!-- Outer Onyx Bowl Body (Translucent) -->
  <g>
    <path d="M 130 200 C 130 290, 195 328, 300 328 C 405 328, 470 290, 470 200 C 470 162, 395 138, 300 138 C 205 138, 130 162, 130 200 Z" fill="url(#onyxBody)"/>
    
    <!-- Onyx Natural Banding / Flow Lines -->
    <path d="M 140 210 Q 220 270, 300 280 T 460 210" stroke="#fef3c7" stroke-width="3.5" fill="none" opacity="0.75" stroke-linecap="round"/>
    <path d="M 150 240 Q 230 295, 300 305 T 450 240" stroke="#fde047" stroke-width="2.5" fill="none" opacity="0.65" stroke-linecap="round"/>
    <path d="M 180 180 Q 260 230, 340 245 T 420 185" stroke="#b45309" stroke-width="2" fill="none" opacity="0.5"/>
    <path d="M 210 160 Q 280 200, 380 190" stroke="#fffbeb" stroke-width="2" fill="none" opacity="0.8"/>
    
    <!-- Inner Bowl Cavity with Glowing Core -->
    <ellipse cx="300" cy="200" rx="155" ry="54" fill="url(#onyxGlow)"/>
    
    <!-- Light Burst from inside -->
    <ellipse cx="300" cy="205" rx="130" ry="40" fill="#ffffff" opacity="0.45" filter="url(#goldGlow)"/>
    
    <!-- Drain Hole (Lubang Afur Gold/Brass Finish) -->
    <ellipse cx="300" cy="220" rx="22" ry="9" fill="#78350f"/>
    <ellipse cx="300" cy="219" rx="18" ry="7" fill="#fbbf24"/>
    <ellipse cx="300" cy="218" rx="14" ry="5" fill="#451a03"/>
    <circle cx="300" cy="218" r="3" fill="#fef08a"/>
  </g>

  <!-- Super Glossy Translucent Specular Highlight -->
  <path d="M 160 185 C 190 160, 245 150, 300 150 C 355 150, 410 160, 440 185 C 405 170, 350 160, 300 160 C 250 160, 195 170, 160 185 Z" fill="#ffffff" opacity="0.85"/>

  <!-- Badge Info -->
  <rect x="24" y="24" width="180" height="32" rx="16" fill="#d97706" opacity="0.95"/>
  <text x="114" y="44" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">TEMBUS CAHAYA (ONYX)</text>
</svg>
