<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <radialGradient id="marbleGrad" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f1f5f9"/>
      <stop offset="85%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </radialGradient>
    <radialGradient id="innerBowl" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="70%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </radialGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="15" flood-opacity="0.18" flood-color="#0f172a"/>
    </filter>
  </defs>

  <!-- Background Countertop -->
  <rect width="600" height="450" fill="url(#bgGrad)"/>
  
  <!-- Countertop surface grid line -->
  <path d="M 0 310 L 600 310" stroke="#cbd5e1" stroke-width="2" opacity="0.6"/>
  <rect y="310" width="600" height="140" fill="#f1f5f9" opacity="0.8"/>

  <!-- Shadow below sink -->
  <ellipse cx="300" cy="325" rx="190" ry="38" fill="#0f172a" opacity="0.16" filter="url(#dropShadow)"/>

  <!-- Outer Marble Bowl Body -->
  <g filter="url(#dropShadow)">
    <path d="M 120 200 C 120 290, 190 330, 300 330 C 410 330, 480 290, 480 200 C 480 160, 400 135, 300 135 C 200 135, 120 160, 120 200 Z" fill="url(#marbleGrad)"/>
    
    <!-- Natural Marble Grey Veins -->
    <path d="M 170 170 Q 230 210, 260 270 T 310 320" stroke="#94a3b8" stroke-width="2.5" fill="none" opacity="0.45" stroke-linecap="round"/>
    <path d="M 210 150 Q 280 190, 340 230 T 430 250" stroke="#94a3b8" stroke-width="1.8" fill="none" opacity="0.4" stroke-linecap="round"/>
    <path d="M 360 145 Q 380 200, 420 260" stroke="#64748b" stroke-width="2" fill="none" opacity="0.35" stroke-linecap="round"/>
    
    <!-- Inner Bowl Cavity -->
    <ellipse cx="300" cy="205" rx="165" ry="58" fill="url(#innerBowl)"/>
    
    <!-- Inner Bowl Depth & Veins -->
    <ellipse cx="300" cy="210" rx="145" ry="46" fill="#cbd5e1" opacity="0.5"/>
    <path d="M 230 195 Q 280 220, 370 215" stroke="#64748b" stroke-width="1.5" fill="none" opacity="0.4"/>
    
    <!-- Drain Hole (Lubang Afur 4.5cm) -->
    <ellipse cx="300" cy="225" rx="22" ry="9" fill="#1e293b"/>
    <ellipse cx="300" cy="224" rx="18" ry="7" fill="#64748b"/>
    <ellipse cx="300" cy="223" rx="14" ry="5" fill="#0f172a"/>
    <circle cx="300" cy="223" r="3" fill="#e2e8f0" opacity="0.8"/>
  </g>

  <!-- Hi-Glossy Reflection Highlight -->
  <path d="M 155 185 C 180 160, 240 148, 300 148 C 360 148, 420 160, 445 185 C 410 168, 350 158, 300 158 C 250 158, 190 168, 155 185 Z" fill="#ffffff" opacity="0.65"/>

  <!-- Badge Info -->
  <rect x="24" y="24" width="165" height="32" rx="16" fill="#1e3a8a" opacity="0.9"/>
  <text x="106" y="44" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">UD CAHAYA ONIX</text>
</svg>
